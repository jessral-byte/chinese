<body class="bg-gradient-to-br from-pink-100 via-purple-100 to-blue-100 text-gray-800">

<header class="flex justify-center mt-10 mb-6">

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">

<!-- 卡片通用樣式 -->

<a href="fb-mencius.html" class="group bg-white rounded-3xl shadow-lg overflow-hidden hover:shadow-2xl transition">
