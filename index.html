<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>國文互動教材樂園</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-pink-100 via-purple-100 to-blue-100 text-gray-800">

<!-- Header -->
<header class="flex justify-center mt-10 mb-6">
  <div class="bg-white/80 backdrop-blur shadow-xl rounded-3xl px-8 py-6 text-center max-w-md w-full">
    <h1 class="text-2xl font-bold text-purple-700">✨ 國文魔法教室 ✨</h1>
    <p class="text-gray-500 mt-2">歡迎來到 Renee 老師的學習世界 🪄</p>
    <button class="mt-4 bg-purple-500 hover:bg-purple-600 text-white px-5 py-2 rounded-full shadow transition">
      進入學習 🚀
    </button>
  </div>
</header>

<!-- Main -->
<main class="max-w-6xl mx-auto px-4 pb-12">

<h2 class="text-2xl font-bold mb-6 text-purple-700">📖 魔法教材書櫃</h2>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">

<!-- 孟子 -->
<a href="fb-mencius.html" class="group bg-white rounded-3xl shadow-lg overflow-hidden hover:shadow-2xl transition">
  
  <div class="relative w-full aspect-[16/9] overflow-hidden">
    <img src="./images/mencius.jpg" class="absolute w-full h-full object-cover object-center group-hover:scale-105 transition duration-300">
    <div class="absolute inset-0 bg-black/30 group-hover:bg-black/20 transition"></div>
    <div class="absolute bottom-3 left-4 text-white">
      <h3 class="text-lg font-bold">孟子思想</h3>
      <p class="text-sm">性善論 × 憂患意識</p>
    </div>
  </div>

  <div class="p-5">
    <p class="text-gray-600 text-sm">
      跟著孟子探索人生與道德選擇的智慧。
    </p>
  </div>

</a>

<!-- 對聯 -->
<a href="duilian.html" class="group bg-white rounded-3xl shadow-lg overflow-hidden hover:shadow-2xl transition">
  
  <div class="relative w-full aspect-[16/9] overflow-hidden">
    <img src="./images/duilian.jpg" class="absolute w-full h-full object-cover object-center group-hover:scale-105 transition duration-300">
    <div class="absolute inset-0 bg-black/30 group-hover:bg-black/20 transition"></div>
    <div class="absolute bottom-3 left-4 text-white">
      <h3 class="text-lg font-bold">對聯藝術</h3>
      <p class="text-sm">對仗 × 平仄 × 意境</p>
    </div>
  </div>

  <div class="p-5">
    <p class="text-gray-600 text-sm">
      練習對聯結構與語感，培養文學美感。
    </p>
  </div>

</a>

<!-- 種梨 -->
<a href="liaozhai-pear.html" class="group bg-white rounded-3xl shadow-lg overflow-hidden hover:shadow-2xl transition">
  
  <div class="relative w-full aspect-[16/9] overflow-hidden">
    <img src="./images/pear.jpg" class="absolute w-full h-full object-cover object-center group-hover:scale-105 transition duration-300">
    <div class="absolute inset-0 bg-black/30 group-hover:bg-black/20 transition"></div>
    <div class="absolute bottom-3 left-4 text-white">
      <h3 class="text-lg font-bold">聊齋志異-種梨</h3>
      <p class="text-sm">奇幻 × 人性 × 寓意</p>
    </div>
  </div>

  <div class="p-5">
    <p class="text-gray-600 text-sm">
      走進奇幻故事，理解人性與價值。
    </p>
  </div>

</a>

<!-- 二十年後 -->
<a href="twenty-years.html" class="group bg-white rounded-3xl shadow-lg overflow-hidden hover:shadow-2xl transition">
  
  <div class="relative w-full aspect-[16/9] overflow-hidden">
    <img src="./images/20years.jpg" class="absolute w-full h-full object-cover object-center group-hover:scale-105 transition duration-300">
    <div class="absolute inset-0 bg-black/30 group-hover:bg-black/20 transition"></div>
    <div class="absolute bottom-3 left-4 text-white">
      <h3 class="text-lg font-bold">二十年後</h3>
      <p class="text-sm">友情 × 選擇 × 命運</p>
    </div>
  </div>

  <div class="p-5">
    <p class="text-gray-600 text-sm">
      從重逢情境思考時間與人生選擇。
    </p>
  </div>

</a>

</div>

</main>

<!-- Footer -->
<footer class="text-center text-purple-400 pb-6 text-sm">
✨ 教學展示級（圖片最佳化版）✨
</footer>

</body>
</html>
